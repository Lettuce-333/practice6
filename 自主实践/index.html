<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园咖啡店销售数据看板</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 360px; }
    #status { display: none; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">校园咖啡店销售数据看板</h1>
    <p class="text-muted" id="sub-title">数据来源：自主实践模拟数据集</p>
  </header>
  <p id="status" class="alert alert-warning"></p>
  <section class="row g-3 mb-4" id="cards"></section>
  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">各月品类销量对比（ECharts柱状图，单位：杯）</h2>
      <p class="small text-muted">数据来源：自主实践模拟数据（2026年1—8月）</p>
      <div id="bar-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">销量变化趋势（Chart.js折线图，单位：杯）</h2>
      <p class="small text-muted">数据来源：自主实践模拟数据（2026年1—8月）</p>
      <div class="chart-box"><canvas id="line-chart"></canvas></div>
    </div>
  </section>
  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
